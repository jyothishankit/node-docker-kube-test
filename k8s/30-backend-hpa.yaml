apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: crud-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 5 # worst case 5 x 50Mi = 250Mi of backend memory
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50 # % of the 100m CPU request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent # at most double every 15s...
          value: 100
          periodSeconds: 15
        - type: Pods # ...or add up to 2 pods, whichever is more
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # The Kubernetes default is 300s. 60s makes the demo quicker while
      # still avoiding flapping when load briefly dips.
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 15
