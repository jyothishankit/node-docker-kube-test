  .sub code { font-size: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 20px; }

  .tile .note { color: var(--ink-muted); font-size: 12px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }

  .status.pass { color: var(--good-ink); }
  .status.fail { color: var(--critical); }
  .charts { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px 12px; position: relative; }
  .chart-title { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 12px; margin: 12px 0 2px 44px; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { fill: var(--ink-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .ref-label { fill: var(--ink-2); }
  .chart .band-label { fill: var(--ink-2); font-size: 11px; }
  .tooltip {

  .tooltip .row span:first-child { color: var(--ink-2); }
  .tooltip .row span:last-child { font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; font-size: 12px; }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  .table-wrap { overflow-x: auto; }
  details summary { cursor: pointer; color: var(--ink-2); margin: 24px 0 10px; }
  .errors { color: var(--ink-2); }
</style>
</head>

function niceMax(v, integer) {
  if (!(v > 0)) return 1;
  if (integer) return Math.max(1, Math.ceil(v * 1.15));
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v * 1.05) return m * p;

    });
    svg += `<path d="${d}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    svg += `<line class="xh" x1="0" x2="0" y1="${M.t}" y2="${M.t + ih}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>`;
    svg += `<circle class="dot" r="4.5" fill="var(--series)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
    svg += `<rect class="hit" x="${M.l}" y="0" width="${iw}" height="${H}" fill="transparent"/>`;
    svg += '</svg>';

    const wrap = document.createElement('div');
    wrap.className = 'chart';
    wrap.innerHTML = svg;
    host.appendChild(wrap);
    chartEls.push({ c, svg: wrap.querySelector('svg'), x, y });
  });

  chartEls.forEach(({ svg }) => {
    const hit = svg.querySelector('.hit');
    hit.addEventListener('pointermove', (e) => onMove(e, svg));
    hit.addEventListener('pointerleave', hideHover);
  });
}

function onMove(e, svg) {
  const box = svg.getBoundingClientRect();
  const W = svg.viewBox.baseVal.width;
  const px = ((e.clientX - box.left) / box.width) * W;
  const iw = W - M.l - M.r;
  const t = ((px - M.l) / iw) * tMax;
  let best = rows[0];
  for (const r of rows) if (Math.abs(r.t - t) < Math.abs(best.t - t)) best = r;

  chartEls.forEach(({ c, svg: s, x, y }) => {
    const xh = s.querySelector('.xh'), dot = s.querySelector('.dot');
    xh.setAttribute('x1', x(best.t)); xh.setAttribute('x2', x(best.t)); xh.setAttribute('visibility', 'visible');
    const v = best[c.key];
    if (v == null) dot.setAttribute('visibility', 'hidden');
    else { dot.setAttribute('cx', x(best.t)); dot.setAttribute('cy', y(v)); dot.setAttribute('visibility', 'visible'); }
  });

  const tt = $('tooltip');
  tt.innerHTML = `<div class="tt-head">${best.t}s · ${esc(best.phase)}</div>` +
    [['Users', fmtInt(best.users)], ['Throughput', `${fmtInt(best.rps)} req/s`], ['Errors', fmtInt(best.errors)],
     ['p95 latency', `${fmtInt(best.p95)} ms`], ['Pods answering', fmtInt(best.pods)],
     ['Replicas (ready/total)', best.replicas == null ? '–' : `${best.ready}/${best.replicas}`],
     ['HPA desired', fmtInt(best.desired)], ['CPU', best.cpu == null ? '–' : `${best.cpu}%`]]
      .map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
  tt.style.display = 'block';
  const tw = tt.offsetWidth, th = tt.offsetHeight;
  let left = e.clientX + 14, top = e.clientY + 14;
  if (left + tw > window.innerWidth - 8) left = e.clientX - tw - 14;
  if (top + th > window.innerHeight - 8) top = e.clientY - th - 14;
  tt.style.left = `${Math.max(8, left)}px`;
  tt.style.top = `${Math.max(8, top)}px`;
}

function hideHover() {
  $('tooltip').style.display = 'none';
  chartEls.forEach(({ svg }) => {
    svg.querySelector('.xh').setAttribute('visibility', 'hidden');
    svg.querySelector('.dot').setAttribute('visibility', 'hidden');
  });
}

render();
let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 100); });

// ---------------------------------------------------------------- tables
$('changes').innerHTML = '<tr><th>Time</th><th class="l">Change</th><th class="l">Phase</th><th>Users</th><th>req/s</th><th>CPU</th></tr>' +
  (changes.length ? changes.map((c) => `<tr><td>${c.t}s</td><td class="l">${c.from} → ${c.to} (${c.to > c.from ? 'scaled up' : 'scaled down'})</td>` +
    `<td class="l">${esc(c.phase)}</td><td>${fmtInt(c.users)}</td><td>${fmtInt(c.rps)}</td><td>${c.cpu == null ? '–' : c.cpu + '%'}</td></tr>`).join('')
    : '<tr><td colspan="6" class="l">No replica changes recorded.</td></tr>');

const errs = Object.entries(summary.error_types || {});
$('errors').textContent = errs.length ? 'Errors by type: ' + errs.map(([k, v]) => `${k} × ${v}`).join(', ') : 'No request errors.';

$('intervals').innerHTML = '<tr><th>Time</th><th class="l">Phase</th><th>Users</th><th>req/s</th><th>Errors</th><th>Capped</th><th>p50 ms</th><th>p95 ms</th><th>Pods hit</th><th>Replicas</th><th>Desired</th><th>CPU</th></tr>' +
  rows.map((r) => `<tr><td>${r.t}s</td><td class="l">${esc(r.phase)}</td><td>${fmtInt(r.users)}</td><td>${fmt1(r.rps)}</td><td>${fmtInt(r.errors)}</td>` +
    `<td>${fmtInt(r.capped)}</td><td>${fmtInt(r.p50)}</td><td>${fmtInt(r.p95)}</td><td>${fmtInt(r.pods)}</td>` +
    `<td>${r.replicas == null ? '–' : `${r.ready}/${r.replicas}`}</td><td>${fmtInt(r.desired)}</td><td>${r.cpu == null ? '–' : r.cpu + '%'}</td></tr>`).join('');
</script>
</body>
