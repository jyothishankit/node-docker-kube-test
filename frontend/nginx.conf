# Full nginx config (replaces /etc/nginx/nginx.conf) so the worker count is
# fixed: `auto` would start one worker per host CPU and waste memory.
worker_processes 2;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend Kubernetes Service (or compose service).
    # No upstream keepalive on purpose: each proxied request opens a fresh
    # connection, so kube-proxy spreads load evenly across backend replicas,
    # including ones the HPA just added.
    location /api/ {
      proxy_pass http://backend:5000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      # Small request/response buffers; never spill responses to disk.
      client_max_body_size 16k;
      proxy_max_temp_file_size 0;
    }

    location /healthz {
      return 200 'ok';
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
